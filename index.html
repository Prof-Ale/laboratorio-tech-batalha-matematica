<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratório Tech - Arena Batalha v6.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- TELA 1: SPLASH SCREEN MASTER -->
<section id="splash-screen" class="screen">
    <div class="splash-inner">
        <div class="splash-logo">LABORATÓRIO TECH</div>
        <div class="splash-sub">SISTEMA DE BATALHA MATEMÁTICA v6.0</div>
        
        <div class="splash-av">
            <img src="assets/img/avatar_estatico.png" alt="Mestre Alê">
        </div>

        <div class="input-group">
            <input type="text" id="nome-cientista" placeholder="IDENTIFIQUE-SE, CIENTISTA MASTER" autocomplete="off">
            <button class="btn-start-neon" onclick="mostrarSeletorBlocos()">ACESSAR SISTEMAS</button>
        </div>
        <div class="splash-sig">Prof. Alessandro Barbosa • MathLab • 2026</div>
    </div>
</section>

<!-- TELA 2: SELETOR DE BLOCOS (5 BLOCOS) -->
<section id="block-selector" class="screen hidden">
    <h2 class="section-title">CENTRAL DE MANUTENÇÃO</h2>
    <p class="section-desc">Selecione o setor de recomposição de aprendizagem</p>
    
    <div class="block-grid">
        <button class="block-card" onclick="iniciarBloco(1)">
            <span class="block-icon">🔢</span>
            <span class="block-name">Bloco 1</span>
            <small>Inteiros: Soma/Sub</small>
        </button>
        <button class="block-card" onclick="iniciarBloco(2)">
            <span class="block-icon">⚖️</span>
            <span class="block-name">Bloco 2</span>
            <small>Múltiplos e Divisores</small>
        </button>
        <button class="block-card" onclick="iniciarBloco(3)">
            <span class="block-icon">📏</span>
            <span class="block-name">Bloco 3</span>
            <small>Inteiros: Mult/Div</small>
        </button>
        <button class="block-card" onclick="iniciarBloco(4)">
            <span class="block-icon">🧩</span>
            <span class="block-name">Bloco 4</span>
            <small>Frações e Decimais</small>
        </button>
        <button class="block-card" onclick="iniciarBloco(5)">
            <span class="block-icon">📊</span>
            <span class="block-name">Bloco 5</span>
            <small>MMC e MDC</small>
        </button>
    </div>
</section>

<!-- TELA 3: ARENA DE JOGO -->
<section id="game-screen" class="screen hidden">
    <div class="scoreboard-battle">
        <div id="box-a" class="team-box team-a">
            7ºA <span id="scoreA">0</span>
        </div>
        <div class="battle-center">
            <button id="btn-buzzer-mode" onclick="toggleBuzzerMode()">MODO: ALTERNADO</button>
        </div>
        <div id="box-b" class="team-box team-b">
            7ºB <span id="scoreB">0</span>
        </div>
    </div>

    <!-- CONTROLES DE MÍDIA SOLICITADOS -->
    <div class="media-controls">
        <button onclick="toggleMusica()">🎵 <span id="tsom">ON</span></button>
        <button onclick="toggleVoz()">🔊 <span id="tvoz">ON</span></button>
        <button onclick="irParaSeletor()">⚙️ BLOCOS</button>
    </div>

    <div class="gw">
        <div class="hud">
            <div class="hi"><div class="hl">Combo</div><div class="hv" id="tcb">0</div></div>
            <div class="hi"><div class="hl">Nível</div><div class="hv" id="tnv">1</div></div>
        </div>
        <canvas id="canvas-game" width="580" height="130"></canvas>
        <div id="conta-display">Carregando...</div>
        <div id="grid-botoes" class="ag"></div>
        <div id="fb"></div>
        <button id="btn-prox" class="hidden" onclick="proximaQ()">PRÓXIMO DESAFIO →</button>
    </div>
</section>

<!-- MODAIS: DASHBOARD E CRÉDITOS -->
<div class="btn-top-group">
    <button class="btn-round" onclick="abrirM('mdash')">📊</button>
    <button class="btn-round" onclick="abrirM('mcred')">i</button>
</div>

<audio id="bgm" loop src="assets/audio/bgm_base.mp3"></audio>
<script type="module" src="js/main.js"></script>
</body>
</html>
