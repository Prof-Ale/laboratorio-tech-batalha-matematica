<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratório Tech - Batalha Matemática</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f3ff; --neon-pink: #ff00ff; --neon-green: #39ff14;
            --bg-dark: #0a0a12; --panel-bg: #16213e;
        }
        body {
            background: var(--bg-dark); color: white; font-family: 'Nunito', sans-serif;
            margin: 0; text-align: center; overflow-x: hidden;
        }
        .screen { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 20px; }
        .hidden { display: none !important; }

        /* Placar de Batalha */
        .scoreboard {
            display: flex; justify-content: space-around; background: var(--panel-bg);
            padding: 20px; border-bottom: 4px solid var(--neon-blue); position: sticky; top: 0;
        }
        .team { padding: 15px 30px; border-radius: 15px; border: 2px solid transparent; transition: 0.3s; }
        .team.active { border-color: var(--neon-green); box-shadow: 0 0 20px var(--neon-green); transform: scale(1.05); }
        .team-a { background: #b30000; }
        .team-b { background: #0000b3; }
        .score { font-family: 'Orbitron', sans-serif; font-size: 3rem; display: block; }

        /* Área de Questões */
        #question-box { margin-top: 40px; }
        .question-text { font-size: 2.5rem; margin-bottom: 30px; min-height: 100px; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 800px; margin: auto; }
        
        /* Botões DUA (Grandes e Acessíveis) */
        .btn-opt {
            background: #2a2a40; color: white; border: 2px solid var(--neon-blue);
            padding: 25px; font-size: 1.8rem; border-radius: 12px; cursor: pointer; transition: 0.2s;
        }
        .btn-opt:hover { background: var(--neon-blue); color: black; box-shadow: 0 0 15px var(--neon-blue); }

        /* Splash e Seletor */
        .splash-logo { font-family: 'Orbitron', sans-serif; font-size: 3.5rem; color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); }
        .btn-start { background: var(--neon-green); color: black; padding: 20px 40px; font-size: 1.5rem; font-weight: 900; border: none; border-radius: 50px; cursor: pointer; margin-top: 30px; }
        
        #feedback { font-size: 2rem; font-weight: 900; margin-top: 20px; height: 40px; }
        .win-screen { position: fixed; top: 0; background: var(--bg-dark); width: 100%; height: 100%; z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    </style>
</head>
<body>

<!-- TELA INICIAL -->
<section id="splash-screen" class="screen">
    <div class="splash-logo">LABORATÓRIO TECH</div>
    <h2>Batalha Matemática: 7ºA vs 7ºB</h2>
    <input type="text" id="prof-name" placeholder="Nome do Mediador" style="padding: 10px; font-size: 1.2rem; width: 300px; margin: 20px auto; border-radius: 8px;">
    <button class="btn-start" onclick="iniciarJogo()">INICIAR BATALHA ⚔️</button>
</section>

<!-- TELA DO JOGO -->
<section id="game-screen" class="screen hidden">
    <div class="scoreboard">
        <div id="box-a" class="team team-a active">
            <span style="font-size: 1.5rem; font-weight: 900;">7º ANO A</span>
            <span id="pts-a" class="score">0</span>
            <small id="combo-a">Combo: x1</small>
        </div>
        <div style="text-align: center;">
            <div id="round-info" style="color: var(--neon-green); font-weight: bold;">RODADA 1</div>
            <h2 id="turn-msg">VEZ DO 7ºA</h2>
        </div>
        <div id="box-b" class="team team-b">
            <span style="font-size: 1.5rem; font-weight: 900;">7º ANO B</span>
            <span id="pts-b" class="score">0</span>
            <small id="combo-b">Combo: x1</small>
        </div>
    </div>

    <div id="question-box">
        <div id="bloco-label" style="color: var(--neon-pink); font-weight: bold;">[ BLOCO 1: INTEIROS ]</div>
        <div id="question-text" class="question-text">Quanto é (-5) + 8?</div>
        <div id="options-grid" class="options-grid"></div>
        <div id="feedback"></div>
        <div id="dica-box" style="margin-top: 20px; color: #aaa; font-style: italic;"></div>
    </div>
</section>

<!-- TELA DE VITÓRIA -->
<div id="win-screen" class="win-screen hidden">
    <h1 id="winner-name" style="font-size: 5rem; color: var(--neon-green);">7ºA VENCEU!</h1>
    <p style="font-size: 2rem;">🏆 Parabéns pela cooperação e raciocínio!</p>
    <button class="btn-start" onclick="location.reload()">NOVA PARTIDA</button>
</div>

<script>
// BANCO DE QUESTÕES (Exemplo dos Blocos 1 e 2)
const banco = [
    { q: "(-15) + 20 = ?", opts: [5, -5, 35, -35], res: 5, dica: "Pense em dívida e crédito.", bncc: "EF07MA03", bloco: "Inteiros" },
    { q: "O oposto de -12 é?", opts: [0, 12, -12, 1], res: 12, dica: "O oposto é o inverso do sinal.", bncc: "EF07MA03", bloco: "Inteiros" },
    { q: "3/4 de 40 é?", opts: [10, 20, 30, 40], res: 30, dica: "Divida por 4 e multiplique por 3.", bncc: "EF07MA06", bloco: "Frações" },
    { q: "2x + 5 = 15. Qual o valor de x?", opts: [5, 10, 2, 8], res: 5, dica: "Passe o 5 subtraindo.", bncc: "EF07MA14", bloco: "Álgebra" },
    { q: "Qual o MDC de 12 e 18?", opts: [2, 3, 6, 9], res: 6, dica: "Maior divisor comum.", bncc: "EF07MA01", bloco: "Múltiplos" }
];

let state = {
    ptsA: 0, ptsB: 0, comboA: 0, comboB: 0,
    turno: 'A', qIndex: 0, rodada: 1
};

function iniciarJogo() {
    document.getElementById('splash-screen').classList.add('hidden');
    document.getElementById('game-screen').classList.remove('hidden');
    carregarQuestao();
}

function carregarQuestao() {
    const q = banco[state.qIndex];
    document.getElementById('question-text').innerText = q.q;
    document.getElementById('bloco-label').innerText = `BLOCO: ${q.bloco} | BNCC: ${q.bncc}`;
    document.getElementById('dica-box').innerText = `Dica: ${q.dica}`;
    document.getElementById('feedback').innerText = "";
    
    const grid = document.getElementById('options-grid');
    grid.innerHTML = '';
    
    q.opts.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'btn-opt';
        btn.innerText = opt;
        btn.onclick = () => verificar(opt);
        grid.appendChild(btn);
    });

    atualizarInterface();
}

function verificar(escolha) {
    const q = banco[state.qIndex];
    const isCorrect = escolha === q.res;
    const fb = document.getElementById('feedback');

    if (isCorrect) {
        fb.innerText = "✅ ACERTOU!";
        fb.style.color = "var(--neon-green)";
        processarPonto();
    } else {
        fb.innerText = "❌ ERROU!";
        fb.style.color = "var(--neon-pink)";
        resetCombo();
    }

    setTimeout(() => {
        state.turno = state.turno === 'A' ? 'B' : 'A';
        state.qIndex = (state.qIndex + 1) % banco.length;
        state.rodada++;
        if (state.ptsA >= 100 || state.ptsB >= 100) finalizar();
        else carregarQuestao();
    }, 1500);
}

function processarPonto() {
    let pts = 10;
    if (state.turno === 'A') {
        state.comboA++;
        if (state.comboA >= 2) pts = 15;
        if (state.comboA >= 3) pts = 20;
        state.ptsA += pts;
    } else {
        state.comboB++;
        if (state.comboB >= 2) pts = 15;
        if (state.comboB >= 3) pts = 20;
        state.ptsB += pts;
    }
}

function resetCombo() {
    if (state.turno === 'A') state.comboA = 0;
    else state.comboB = 0;
}

function atualizarInterface() {
    document.getElementById('pts-a').innerText = state.ptsA;
    document.getElementById('pts-b').innerText = state.ptsB;
    document.getElementById('combo-a').innerText = `Combo: x${state.comboA || 1}`;
    document.getElementById('combo-b').innerText = `Combo: x${state.comboB || 1}`;
    document.getElementById('box-a').className = `team team-a ${state.turno === 'A' ? 'active' : ''}`;
    document.getElementById('box-b').className = `team team-b ${state.turno === 'B' ? 'active' : ''}`;
    document.getElementById('turn-msg').innerText = `VEZ DO 7º${state.turno}`;
    document.getElementById('round-info').innerText = `RODADA ${state.rodada}`;
}

function finalizar() {
    document.getElementById('win-screen').classList.remove('hidden');
    document.getElementById('winner-name').innerText = state.ptsA >= 100 ? "7ºA VENCEU!" : "7ºB VENCEU!";
}
</script>
</body>
</html>
